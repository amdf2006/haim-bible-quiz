<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>하임 성경 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F0; --bg3:#EAEAE4; --border:#D0CEBF;
  --gold:#C8960A; --text:#1A1A1A; --muted:#6B6B6B;
  --green:#2E9E63; --red:#D03030; --blue:#2A6FBF; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text);min-height:100%;padding:16px 16px 60px}
.wrap{max-width:860px;margin:0 auto}
.serif{font-family:'Noto Serif KR',serif}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(26px,5vw,46px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
h2{font-family:'Noto Serif KR',serif;font-size:clamp(17px,3vw,22px);font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.hidden{display:none!important}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--text);background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
select option{background:#fff}
button{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:9px;cursor:pointer;padding:12px 18px;transition:filter .1s,transform .08s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover:not(:disabled){filter:brightness(1.08)}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);font-size:13px;padding:8px 14px}
.btn-sm{padding:8px 14px;font-size:13px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}

.roomcode{font-family:'Noto Serif KR',serif;font-size:clamp(44px,10vw,76px);font-weight:900;letter-spacing:.3em;text-indent:.3em;color:var(--gold)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode-btn{background:#fff;border:2px solid var(--border);border-radius:10px;padding:14px 8px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;line-height:1.4}
.mode-btn:hover{border-color:var(--gold)}
.mode-btn.active{border-color:var(--gold);background:rgba(200,150,10,.08);color:var(--gold)}
.mode-btn .icon{font-size:22px;display:block;margin-bottom:4px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.team-btn{background:#fff;border:2px solid var(--border);border-radius:10px;padding:18px 8px;color:var(--text);font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:border-color .15s}
.team-btn:hover{border-color:var(--gold);color:var(--gold)}
.qbox{border-left:4px solid var(--gold);padding:16px 18px;background:#fff;border-radius:0 var(--r) var(--r) 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.qnum{font-size:12px;color:var(--gold);letter-spacing:.15em;margin-bottom:8px;font-weight:700}
.qtext{font-family:'Noto Serif KR',serif;font-size:clamp(18px,3vw,26px);line-height:1.55}

/* Timer */
.timer-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.timer-circle-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.timer-svg{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--bg3);stroke-width:6}
.timer-arc{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .5s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900}
.timer-label{font-size:14px;color:var(--muted)}

/* Flash */
#flashOverlay{position:fixed;inset:0;pointer-events:none;z-index:9999;background:rgba(200,30,30,0);transition:background .15s}
#flashOverlay.flash{background:rgba(200,30,30,.28)}

/* Answer options */
.opt-grid{display:grid;gap:10px;margin-top:14px}
.opt-btn{position:relative;overflow:hidden;width:100%;text-align:left;background:#fff;color:var(--text);border:2px solid var(--border);border-radius:11px;padding:15px 18px;font-size:16px;font-weight:500;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.opt-btn:hover:not(:disabled){border-color:var(--gold)}
.opt-btn.selected{border-color:var(--gold);background:rgba(200,150,10,.07)}
.opt-btn.correct{border-color:var(--green);background:rgba(46,158,99,.09)}
.opt-btn.wrong{border-color:var(--red);background:rgba(208,48,48,.07);opacity:.8}
.opt-btn.dim{opacity:.45}
.opt-num{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.opt-btn.selected .opt-num{background:var(--gold);color:#fff;border-color:var(--gold)}
.opt-btn.correct .opt-num{background:var(--green);color:#fff;border-color:var(--green)}
.opt-bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(200,150,10,.07);pointer-events:none}
.opt-btn.correct .opt-bar{background:rgba(46,158,99,.07)}
.opt-count{margin-left:auto;font-size:13px;color:var(--gold);font-weight:700;flex-shrink:0}

/* Scoreboard */
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.score-card{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.score-card.leader{border-color:var(--gold)}
.score-card .sc-name{font-size:13px;color:var(--muted);margin-bottom:4px}
.score-card .sc-val{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:900;color:var(--gold)}
.score-card .sc-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Ranking */
.rank-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rank-item{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rank-item.me{border-color:var(--gold)}
.rank-num{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;color:var(--muted);width:28px;flex-shrink:0}
.rank-num.top{color:var(--gold)}
.rank-name{flex:1;font-weight:700}
.rank-team{font-size:12px;color:var(--muted)}
.rank-score{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900;color:var(--gold)}

/* Misc */
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live-dot{animation:none}}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted)}
.pill b{color:var(--gold)}
.queue-item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.queue-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.queue-actions{display:flex;gap:6px;flex-shrink:0}
.notice{font-size:13px;color:var(--muted);line-height:1.7}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.waiting-dots span{animation:blink 1.4s infinite}
.waiting-dots span:nth-child(2){animation-delay:.2s}
.waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.result-badge{display:inline-block;padding:8px 20px;border-radius:999px;font-weight:700;font-size:16px;margin-top:12px}
.result-badge.correct{background:rgba(46,158,99,.12);color:var(--green);border:1.5px solid var(--green)}
.result-badge.wrong{background:rgba(208,48,48,.1);color:var(--red);border:1.5px solid var(--red)}
.result-badge.none{background:var(--bg3);color:var(--muted);border:1.5px solid var(--border)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
details summary:hover{color:var(--gold)}

/* 정답 공개 버튼 */
.reveal-big-btn{width:100%;padding:18px;font-size:19px;font-weight:900;background:var(--green);color:#fff;border-radius:12px;border:none;cursor:pointer;margin-top:14px;transition:filter .1s,transform .08s}
.reveal-big-btn:hover:not(:disabled){filter:brightness(1.08)}
.reveal-big-btn:disabled{opacity:.4;cursor:not-allowed}

/* 최종결과 버튼 */
.final-btn{width:100%;padding:20px;font-size:20px;font-weight:900;background:var(--gold);color:#fff;border-radius:12px;border:none;cursor:pointer;margin-top:16px;box-shadow:0 4px 20px rgba(200,150,10,.3);transition:filter .1s,transform .08s}
.final-btn:hover{filter:brightness(1.08)}

/* 전원 완료 배지 */
.all-done{display:inline-flex;align-items:center;gap:8px;background:rgba(46,158,99,.1);border:1px solid var(--green);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--green);font-weight:700;margin-top:10px}

/* ── 정답 공개 오버레이 ── */
#revealOverlay{position:fixed;inset:0;z-index:8000;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.0)}
.answer-announce{font-family:'Noto Serif KR',serif;font-size:clamp(30px,8vw,68px);font-weight:900;color:var(--gold);text-align:center;padding:0 20px;line-height:1.3;animation:announceIn .5s cubic-bezier(.175,.885,.32,1.275) both;background:rgba(255,255,255,.92);border-radius:20px;padding:24px 40px;box-shadow:0 8px 40px rgba(0,0,0,.15)}
@keyframes announceIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* WRONG */
#wrongOverlay{position:fixed;inset:0;z-index:9000;pointer-events:none;display:flex;align-items:center;justify-content:center}
.wrong-text{font-family:'Noto Serif KR',serif;font-size:clamp(64px,18vw,160px);font-weight:900;color:#CC0000;letter-spacing:.05em;opacity:0;text-shadow:0 0 40px rgba(200,0,0,.4)}
@keyframes wrongIn{0%{opacity:0;transform:scale(2.5)}20%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-18px)}30%{transform:translateX(18px)}45%{transform:translateX(-14px)}60%{transform:translateX(14px)}75%{transform:translateX(-8px)}88%{transform:translateX(8px)}}
@keyframes wrongFlash{0%,100%{background:rgba(200,30,30,0)}20%,60%{background:rgba(200,30,30,.4)}40%,80%{background:rgba(200,30,30,.1)}}

/* 예수님 SVG 애니메이션 */
#jesusOverlay{position:fixed;inset:0;z-index:9100;pointer-events:none;display:flex;align-items:center;justify-content:center}
#jesusFigure{opacity:0}
@keyframes jesusAppear{0%{opacity:0;transform:scale(.2) translateY(60px)}30%{opacity:1;transform:scale(1.08) translateY(-10px)}50%{transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.6) translateY(-40px)}}

/* 최종 순위 전용 */
.final-rank-wrap{max-width:600px;margin:0 auto}
.final-rank-item{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.final-rank-item.rank1{border-color:#FFD700;background:rgba(255,215,0,.06)}
.final-rank-item.rank2{border-color:#C0C0C0;background:rgba(192,192,192,.06)}
.final-rank-item.rank3{border-color:#CD7F32;background:rgba(205,127,50,.06)}
.final-rank-num{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;width:36px;text-align:center;flex-shrink:0}
.final-rank-item.rank1 .final-rank-num{color:#B8860B}
.final-rank-item.rank2 .final-rank-num{color:#808080}
.final-rank-item.rank3 .final-rank-num{color:#8B4513}
.final-rank-name{flex:1;font-size:17px;font-weight:700}
.final-rank-team{font-size:12px;color:var(--muted)}
.final-rank-score{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;color:var(--gold)}
.final-medal{font-size:24px;flex-shrink:0}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, off, remove }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZq1EuGmgHeUln6UyM_L25sJdqCvfzvMU",
  authDomain: "haim-bible-quiz.firebaseapp.com",
  databaseURL: "https://haim-bible-quiz-default-rtdb.firebaseio.com",
  projectId: "haim-bible-quiz",
  storageBucket: "haim-bible-quiz.firebasestorage.app",
  messagingSenderId: "917253634065",
  appId: "1:917253634065:web:97f3b05042da918be6d9b0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Array.from({length:n},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join('');
const app = document.getElementById('app');
const flash = document.getElementById('flashOverlay');

let role=null, roomCode=null, pid=rand(10), myName='', myTeam=null;
let listeners=[], hostQueue=[], editIdx=null;
let timerInterval=null, flashInterval=null;
let lastPhase=null, lastQid=null;
let dingPlayed=false;
let hostTimerRemaining=0;

function dbRef(path){ return ref(db, path); }
function roomRef(p){ return ref(db, `rooms/${roomCode}/${p}`); }
function clearListeners(){ listeners.forEach(({r,fn})=>off(r,'value',fn)); listeners=[]; }
function listen(r,fn){ onValue(r,fn); listeners.push({r,fn}); }
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function stopFlash(){ if(flashInterval){clearInterval(flashInterval);flashInterval=null;} flash.className=''; }

/* ── 소리들 ── */
function playDing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660,ctx.currentTime+0.3);
    gain.gain.setValueAtTime(0.4,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);
    osc.start(); osc.stop(ctx.currentTime+0.6);
  }catch(e){}
}

function playCorrectSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047].forEach((freq,i)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime+i*.12);
      gain.gain.linearRampToValueAtTime(0.25,ctx.currentTime+i*.12+.04);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*.12+.3);
      osc.start(ctx.currentTime+i*.12); osc.stop(ctx.currentTime+i*.12+.35);
    });
  }catch(e){}
}

function playWrongBuzz(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    // 낮은 buzz — sawtooth + 빠른 감쇠 2회
    [0, 0.32].forEach(delay=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sawtooth';
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(140, ctx.currentTime+delay);
      osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+delay+0.28);
      gain.gain.setValueAtTime(0.5, ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.28);
      osc.start(ctx.currentTime+delay); osc.stop(ctx.currentTime+delay+0.3);
    });
  }catch(e){}
}

function playClapSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const bufSize=ctx.sampleRate*0.08;
    const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
    [0,0.22,0.44].forEach(d=>{
      const src=ctx.createBufferSource(), gain=ctx.createGain();
      const filter=ctx.createBiquadFilter();
      filter.type='bandpass'; filter.frequency.value=1200;
      src.buffer=buf; src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.6,ctx.currentTime+d);
      src.start(ctx.currentTime+d);
    });
  }catch(e){}
}

  const root=document.getElementById('hostRoot'); if(!root) return;

  // 팀 점수판

  if(isTeam&&info.teams&&info.teams.length){
    const scores=info.scores||{};

      <div class="score-card ${(scores[t]||0)===max&&max>0?'leader':''}">
        <div class="sc-name">${esc(t)}</div>
        <div class="sc-val">${Math.round((scores[t]||0)*10)/10}</div>

    phaseHTML=`
    <div class="card mt16">
      <h2>문제 출제 <span style="font-size:14px;color:var(--muted);font-weight:400">${info.qid||0}/${info.totalQ||'?'}문제</span>${ansHint}</h2>
      <div class="mt12"><label>문제</label>
        <textarea id="qText" rows="2" placeholder="예: 예수님이 태어나신 곳은?">${esc(preQ)}</textarea></div>
      <div class="mt12"><label>보기 (한 줄에 하나, 2~4개)</label>
        <textarea id="qOpts" rows="4" placeholder="베들레헴&#10;나사렛&#10;예루살렘&#10;가나">${esc(preO)}</textarea></div>
      <div class="mt12 row" style="align-items:flex-end">
        <div><label>제한시간</label>
          <select id="qTimer">
            <option value="10" ${info.defTimer===10?'selected':''}>10초</option>
            <option value="15" ${info.defTimer===15?'selected':''}>15초</option>
            <option value="20" ${info.defTimer===20||!info.defTimer?'selected':''}>20초</option>
            <option value="30" ${info.defTimer===30?'selected':''}>30초</option>
          </select></div>
        <button class="btn-gold" id="fireBtn" style="flex:none">${allDone&&info.phase==='revealed'?'추가 문제 전송 →':'문제 전송 →'}</button>
      </div>
      <div class="err" id="qErr"></div>
      <hr class="divider">
      <details id="bulkBox">
        <summary>문제 미리 입력하기 (문제, 보기1, 보기2, 보기3, 정답번호)</summary>
        <textarea class="mt8" id="bulkTA" rows="5" placeholder="예수님이 태어나신 곳은?, 베들레헴, 나사렛, 예루살렘, 1"></textarea>
        <button class="btn-ghost btn-sm mt8" id="addBulkBtn">${editIdx!==null?'수정 완료':'목록에 추가'}</button>
      </details>
      <div id="queueBox"></div>
    </div>
    ${allDone?`<button class="final-btn" id="finalBtn">🏆 최종 결과 발표하기</button>`:''}`;

  } else if(info.phase==='question'){
    const timerSec=info.timerSec||20;

      ?`<p style="color:var(--green);font-size:14px;margin-top:8px;font-weight:700">이 문제 정답: ${info.presetCorrect+1}번 — ${esc((info.options||[])[info.presetCorrect]||'')}</p>`:'';
    phaseHTML=`
    <div class="card mt16">
      <div class="qbox">
        <div class="qnum"><span class="live-dot"></span>문제 ${info.qid} · 답변 접수 중</div>
        <div class="qtext mt8">${esc(info.question)}</div>
      </div>
      ${correctHint}
      <div class="timer-wrap">
        <div class="timer-circle-wrap">
          <svg class="timer-svg" width="80" height="80" viewBox="0 0 80 80">
            <circle class="timer-bg" cx="40" cy="40" r="34"/>
            <circle class="timer-arc" id="hostTimerArc" cx="40" cy="40" r="34"
              stroke-dasharray="${2*Math.PI*34}" stroke-dashoffset="0" stroke="var(--green)"/>
          </svg>
          <div class="timer-num" id="hostTimerNum">${timerSec}</div>
        </div>
        <div>
          <div class="timer-label" id="hostTimerLabel">남은 시간</div>
          <p style="font-size:13px;color:var(--muted);margin-top:6px">총 <b id="totCount" style="color:var(--gold)">0</b>명 / <b id="totMem" style="color:var(--muted)">0</b>명 답변</p>
          <div id="allDoneArea"></div>
        </div>
      </div>
      <div id="optLive" class="opt-grid"></div>
      <button class="reveal-big-btn" id="revealBtn">✅ 정답 공개하기</button>
    </div>`;
  }

  let revHTML='';
  if(info.phase==='revealed'&&info.counts){
    const tot=Object.values(info.counts).reduce((a,b)=>a+b,0)||1;
    revHTML=`
    <div class="card mt16">
      <div class="qbox"><div class="qnum">문제 ${info.qid} · 결과</div>
        <div class="qtext mt8">${esc(info.question)}</div></div>
      <div class="opt-grid mt12">${info.options.map((o,i)=>{
        const c=info.counts[i]||0, pct=Math.round(c/tot*100);
        return `<div class="opt-btn ${i===info.correct?'correct':'dim'}" style="cursor:default">
          <div class="opt-bar" style="width:${pct}%"></div>
          <div class="opt-num">${i+1}</div>
          <span>${esc(o)}${i===info.correct?' ✓':''}</span>
          <span class="opt-count">${c}명 (${pct}%)</span>
        </div>`;}).join('')}</div>
    </div>`;
  }

  root.innerHTML=`
  <div class="center mt8">
    <p style="font-size:13px;color:var(--muted)">방 코드</p>
    <div class="roomcode">${roomCode}</div>
    <span class="pill mt8"><span class="live-dot"></span>참가자 <b id="memCount">0</b>명</span>
  </div>
  ${isTeam?`<div class="card mt16"><h2>팀 점수판</h2>${sbHTML}
    <details class="mt12"><summary>팀 이름 수정</summary>
      <div class="row mt8"><input id="editTeamNames" value="${esc(info.teams.join(', '))}">
      <button class="btn-ghost btn-sm" id="saveTeamBtn" style="flex:none">저장</button></div>
    </details></div>`:''}
  ${revHTML}
  ${phaseHTML}

    const teams=document.getElementById('editTeamNames').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(teams.length<2) return;
    const scores=Object.fromEntries(teams.map(t=>[t,(info.scores||{})[t]||0]));
    await update(roomRef('info'),{teams,scores});
  };

  if(info.phase==='question'){
    const timerSec=info.timerSec||20;
    const elapsed=info.startedAt?Math.floor((Date.now()-info.startedAt)/1000):0;
    let remaining=Math.max(0,timerSec-elapsed);
    dingPlayed=false;
    hostTimerRemaining=remaining;
    startHostTimer(remaining,timerSec, true);

    listen(roomRef(`answers/${info.qid}`),snap=>{
      const data=snap.exists()?snap.val():{};
      const counts={};
      info.options.forEach((_,i)=>counts[i]=0);
      Object.values(data).forEach(v=>{if(v.choice!=null)counts[v.choice]=(counts[v.choice]||0)+1;});
      const tot=Object.values(counts).reduce((a,b)=>a+b,0);
      const el=document.getElementById('totCount'); if(el) el.textContent=tot;
      const area=document.getElementById('optLive');
      if(area) area.innerHTML=info.options.map((o,i)=>{
        const c=counts[i]||0, pct=tot?Math.round(c/tot*100):0;
        return `<div class="opt-btn" style="cursor:default">
          <div class="opt-bar" style="width:${pct}%;transition:width .4s ease"></div>
          <div class="opt-num">${i+1}</div><span>${esc(o)}</span>
          <span class="opt-count">${c}명</span></div>`;
      }).join('');

      // 전원 답변 → ding + 타이머 5초로
      if(totalMembers>0&&tot>=totalMembers&&!dingPlayed){
        dingPlayed=true; playDing();
        const a2=document.getElementById('allDoneArea');
        if(a2) a2.innerHTML=`<div class="all-done">🎵 전원 답변 완료!</div>`;
        // 타이머를 5초로 강제 변경
        jumpTimerTo5();
      }
    });

    const revealBtn=document.getElementById('revealBtn');
    if(revealBtn) revealBtn.onclick=async()=>{
      revealBtn.disabled=true; revealBtn.textContent='집계 중…';
      const correct=info.presetCorrect!=null?info.presetCorrect:null;
      if(correct===null){
        revealBtn.style.display='none';
        const card=revealBtn.parentNode;
        const grid=document.createElement('div');
        grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px';
        grid.innerHTML=info.options.map((o,i)=>`<button class="btn-ghost" style="border-color:var(--green);color:var(--green)" data-c="${i}">정답: ${i+1}번<br><small>${esc(o)}</small></button>`).join('');
        card.appendChild(grid);
        grid.querySelectorAll('button').forEach(b=>b.onclick=()=>revealAnswer(info,+b.dataset.c));
        return;
      }
      await revealAnswer(info,correct);
    };
  }

  // 최종 결과 버튼
  const finalBtn=document.getElementById('finalBtn');
  if(finalBtn) finalBtn.onclick=async()=>{
    finalBtn.disabled=true; finalBtn.textContent='전송 중…';
    await update(roomRef('info'),{showFinal:true});
  };

  const fireBtn=document.getElementById('fireBtn');
  if(fireBtn){
    renderQueue();
    document.getElementById('addBulkBtn').onclick=()=>{
      const items=parseQueue(document.getElementById('bulkTA').value);
      if(!items.length){document.getElementById('qErr').textContent='형식 오류: 문제, 보기1, 보기2, ..., 정답번호';return;}
      document.getElementById('qErr').textContent='';
      if(editIdx!==null){hostQueue.splice(editIdx,1,...items);editIdx=null;document.getElementById('addBulkBtn').textContent='목록에 추가';}
      else hostQueue.push(...items);
      document.getElementById('bulkTA').value=''; renderQueue();
    };
    fireBtn.onclick=async()=>{
      const q=document.getElementById('qText').value.trim();
      const opts=document.getElementById('qOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const timerSec=parseInt(document.getElementById('qTimer').value);
      const err=document.getElementById('qErr');
      if(!q||opts.length<2||opts.length>4){err.textContent='문제와 보기(2~4개)를 확인해 주세요.';return;}
      let presetCorrect=null;
      if(hostQueue.length&&hostQueue[0].q===q){presetCorrect=hostQueue[0].correct;hostQueue.shift();}
      fireBtn.disabled=true;
      const newQid=(info.qid||0)+1;
      await update(roomRef('info'),{
        phase:'question',qid:newQid,question:q,options:opts,
        correct:null,counts:null,timerSec,startedAt:Date.now(),
        presetCorrect,showFinal:false
      });
      fireBtn.disabled=false;
    };
  }

  let endArmed=false;
  const endBtn=document.getElementById('endBtn');
  endBtn.onclick=async()=>{
    if(!endArmed){
      endArmed=true; endBtn.textContent='정말 삭제할까요? 한 번 더 누르면 삭제됩니다';
      endBtn.style.borderColor='var(--red)'; endBtn.style.color='var(--red)';
      setTimeout(()=>{if(endArmed){endArmed=false;endBtn.textContent='퀴즈 종료 및 방 삭제';endBtn.style.borderColor='';endBtn.style.color='';}},5000);
      return;
    }
    endBtn.disabled=true;
    await remove(dbRef(`rooms/${roomCode}`));
    roomCode=null; role=null; renderLanding('퀴즈가 종료되었습니다.');
  };
}

function jumpTimerTo5(){
  stopTimer();
  // 진행자 타이머를 5초로 세팅
  const arc=document.getElementById('hostTimerArc');
  const numEl=document.getElementById('hostTimerNum');
  const circumference=2*Math.PI*34;
  let remaining=5, total=20;
  if(arc){ arc.style.stroke='var(--red)'; arc.style.strokeDashoffset=circumference*(1-5/total); arc.style.transition='stroke-dashoffset .3s'; }
  if(numEl){ numEl.textContent=5; numEl.style.color='var(--red)'; }
  timerInterval=setInterval(()=>{
    remaining--;
    if(arc) arc.style.strokeDashoffset=circumference*(1-Math.max(remaining,0)/total);
    if(numEl) numEl.textContent=Math.max(remaining,0);
    if(remaining<=0){ stopTimer(); const lb=document.getElementById('hostTimerLabel'); if(lb) lb.textContent='시간 종료!'; }
  },1000);
}

function startHostTimer(remaining,total){
  stopTimer();
  const arc=document.getElementById('hostTimerArc');
  const numEl=document.getElementById('hostTimerNum');
  const circumference=2*Math.PI*34;
  function update(rem){
    if(!arc||!numEl) return;
    arc.style.strokeDashoffset=circumference*(1-Math.max(rem,0)/total);
    numEl.textContent=Math.max(rem,0);
    if(rem<=5){arc.style.stroke='var(--red)';numEl.style.color='var(--red)';}
    else if(rem<=10){arc.style.stroke='var(--gold)';numEl.style.color='var(--gold)';}
    else{arc.style.stroke='var(--green)';numEl.style.color='var(--text)';}
  }
  update(remaining);
  timerInterval=setInterval(()=>{
    remaining--;
    update(remaining);
    if(remaining<=0){stopTimer();const lb=document.getElementById('hostTimerLabel');if(lb)lb.textContent='시간 종료!';}
  },1000);
}

function renderQueue(){
  const box=document.getElementById('queueBox'); if(!box) return;
  if(!hostQueue.length){box.innerHTML='';return;}
  box.innerHTML=`<p style="font-size:13px;color:var(--muted);margin-top:14px">대기 중인 문제 ${hostQueue.length}개</p>`+
    hostQueue.map((it,i)=>`
    <div class="queue-item">
      <span>${i+1}. ${esc(it.q)} <span style="color:var(--green);font-size:12px">[정답:${it.correct+1}번]</span></span>
      <div class="queue-actions">
        <button class="btn-ghost btn-sm qedit" data-i="${i}">수정</button>
        <button class="btn-ghost btn-sm qdel" data-i="${i}">삭제</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('.qdel').forEach(b=>b.onclick=()=>{hostQueue.splice(+b.dataset.i,1);renderQueue();});
  box.querySelectorAll('.qedit').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.i, it=hostQueue[idx];
    const bd=document.getElementById('bulkBox'); if(bd) bd.open=true;
    document.getElementById('bulkTA').value=`${it.q}, ${it.opts.join(', ')}, ${it.correct+1}`;
    editIdx=idx; document.getElementById('addBulkBtn').textContent='수정 완료';
    document.getElementById('bulkTA').focus();
    document.getElementById('qText').value=it.q;
    document.getElementById('qOpts').value=it.opts.join('\n');
  });
}

async function revealAnswer(info,correct){
  const snap=await get(roomRef(`answers/${info.qid}`));
  const data=snap.exists()?snap.val():{};
  const counts={};
  info.options.forEach((_,i)=>counts[i]=0);
  Object.values(data).forEach(v=>{if(v.choice!=null)counts[v.choice]=(counts[v.choice]||0)+1;});
  const memberSnap=await get(roomRef('members'));
  const members=memberSnap.exists()?memberSnap.val():{};
  const updates={};
  const teamCorrect={}, teamTotal={};
  Object.entries(data).forEach(([p,v])=>{
    if(v.choice===correct) updates[`members/${p}/score`]=(members[p]?.score||0)+1;
    if(v.team!=null){
      teamTotal[v.team]=(teamTotal[v.team]||0)+1;
      if(v.choice===correct) teamCorrect[v.team]=(teamCorrect[v.team]||0)+1;
    }
  });
  if(info.teams&&info.teams.length){
    const prevScores=info.scores||{}, prevQid=(info.qid||1)-1;
    info.teams.forEach(t=>{
      const tot=teamTotal[t]||0, cor=teamCorrect[t]||0;
      const pct=tot>0?(cor/tot*100):0;
      const prev=prevScores[t]||0;
      const newScore=prevQid>0?(prev*prevQid+pct)/(prevQid+1):pct;
      updates[`info/scores/${t}`]=Math.round(newScore*10)/10;
    });
  }
  updates['info/phase']='revealed';
  updates['info/correct']=correct;
  updates['info/counts']=counts;
  await update(roomRef(''),updates);
}

      <div class="team-grid">${(info.teams||[]).map((t,i)=>`

/* ══ PLAYER MAIN ══ */
function renderPlayer(){
  clearListeners(); stopTimer(); stopFlash();
  app.innerHTML=`<div id="playerRoot"></div>`;
  listen(roomRef('info'),snap=>{
    if(!snap.exists()){renderLanding('진행자가 퀴즈를 종료했습니다.');return;}
    const info=snap.val();
    // 최종 결과 화면
    if(info.showFinal){
      if(lastPhase!=='final'){lastPhase='final';renderFinalScreen();}
      return;
    }
    if(info.phase!==lastPhase||info.qid!==lastQid){
      lastPhase=info.phase; lastQid=info.qid;
      stopTimer(); stopFlash();
      renderPlayerUI(info);
    }
  });
}

/* ── 최종 순위 화면 (참가자) ── */
async function renderFinalScreen(){
  const memberSnap=await get(roomRef('members'));
  const infoSnap=await get(roomRef('info'));
  const members=memberSnap.exists()?memberSnap.val():{};
  const info=infoSnap.exists()?infoSnap.val():{};
  const sorted=Object.entries(members).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  const medals=['🥇','🥈','🥉'];
  const isTeam=info.mode!=='individual';

  let teamHTML='';
  if(isTeam&&info.teams&&info.teams.length){
    const scores=info.scores||{};
    const sorted2=[...info.teams].sort((a,b)=>(scores[b]||0)-(scores[a]||0));
    teamHTML=`<div class="card mt24"><h2 class="center">🏆 팀 최종 순위</h2>
      <div class="score-grid mt12">${sorted2.map((t,i)=>`
        <div class="score-card ${i===0?'leader':''}">
          <div class="sc-name">${medals[i]||''} ${esc(t)}</div>
          <div class="sc-val">${Math.round((scores[t]||0)*10)/10}</div>
          <div class="sc-sub">정답률 %</div>
        </div>`).join('')}</div></div>`;
  }

  const root=document.getElementById('playerRoot');
  if(!root) return;
  root.innerHTML=`
  <div class="center mt24">
    <h1>🎊 최종 결과</h1>
    <p class="mt8" style="color:var(--muted)">모든 문제가 끝났습니다!</p>
  </div>
  ${teamHTML}
  <div class="card mt24 final-rank-wrap">
    <h2 class="center">🏅 개인 순위</h2>
    <div class="rank-list mt12">${sorted.map(([id,m],idx)=>`
      <div class="final-rank-item ${idx===0?'rank1':idx===1?'rank2':idx===2?'rank3':''}">
        <div class="final-rank-medal">${medals[idx]||''}</div>
        <div class="final-rank-num ${idx<3?'top':''}">${idx+1}</div>
        <div><div class="final-rank-name">${esc(m.name)} ${id===pid?'👈':''}</div>
          ${m.teamName?`<div class="final-rank-team">${esc(m.teamName)}</div>`:''}
        </div>
        <div class="final-rank-score">${m.score||0}점</div>
      </div>`).join('')}
    </div>
  </div>`;
}

let myChoice=null;

function renderPlayerUI(info){
  myChoice=null;
  const root=document.getElementById('playerRoot'); if(!root) return;
  const isTeam=info.mode!=='individual';
  const teamLabel=isTeam&&info.teams?info.teams[myTeam]||'':'';

  let body='';
  if(info.phase==='lobby'){
    body=`<div class="card mt24 center">
      <p class="serif" style="font-size:22px">잠시 기다려 주세요</p>
      <p style="color:var(--muted);margin-top:10px"><span class="live-dot"></span>진행자가 문제를 준비 중입니다
      <span class="waiting-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>`;
  } else if(info.phase==='question'){
    const timerSec=info.timerSec||20;
    body=`
    <div class="card mt16">
      <div class="qbox">
        <div class="qnum">문제 ${info.qid} / ${info.totalQ||'?'}</div>
        <div class="qtext mt8">${esc(info.question)}</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-circle-wrap">
          <svg class="timer-svg" width="80" height="80" viewBox="0 0 80 80">
            <circle class="timer-bg" cx="40" cy="40" r="34"/>
            <circle class="timer-arc" id="timerArc" cx="40" cy="40" r="34"
              stroke-dasharray="${2*Math.PI*34}" stroke-dashoffset="0" stroke="var(--green)"/>
          </svg>
          <div class="timer-num" id="timerNum">${timerSec}</div>
        </div>
        <div>
          <div class="timer-label" id="timerLabel">남은 시간</div>
          <p style="font-size:13px;color:var(--muted);margin-top:6px" id="answerCount"></p>
        </div>
      </div>
      <div class="opt-grid" id="optArea">${info.options.map((o,i)=>`
        <button class="opt-btn" data-c="${i}">
          <div class="opt-num">${i+1}</div>
          <span>${esc(o)}</span>
        </button>`).join('')}
      </div>
      <p class="center mt12" style="font-size:13px;color:var(--muted)" id="choiceStatus">답을 선택하세요!</p>
    </div>`;
  } else if(info.phase==='revealed'){
    body=`
    <div class="card mt16">
      <div class="qbox"><div class="qnum">문제 ${info.qid} · 결과</div>
        <div class="qtext mt8">${esc(info.question)}</div></div>
      <div id="revealOpts" class="opt-grid mt12"></div>
      <div class="center" id="myResultBadge"></div>
    </div>`;
  }

  root.innerHTML=`
  <div class="center mt8">
    <span class="pill">${esc(myName)}${teamLabel?` · ${esc(teamLabel)}`:''} · 방 <b>${roomCode}</b></span>
  </div>
  ${body}`;

  if(info.phase==='question'){
    const timerSec=info.timerSec||20;
    const elapsed=info.startedAt?Math.floor((Date.now()-info.startedAt)/1000):0;
    let remaining=Math.max(0,timerSec-elapsed);
    startPlayerTimer(remaining,timerSec,info.qid);

    document.querySelectorAll('.opt-btn').forEach(b=>{
      b.onclick=async()=>{
        document.querySelectorAll('.opt-btn').forEach(x=>{
          x.classList.remove('selected');
          const n=x.querySelector('.opt-num');
          n.style.background=''; n.style.color=''; n.style.borderColor='';
        });
        myChoice=+b.dataset.c;
        b.classList.add('selected');
        const num=b.querySelector('.opt-num');
        num.style.background='var(--gold)'; num.style.color='#fff'; num.style.borderColor='var(--gold)';
        document.getElementById('choiceStatus').textContent='답을 제출했습니다. 바꾸려면 다른 보기를 누르세요.';
        await set(dbRef(`rooms/${roomCode}/answers/${info.qid}/${pid}`),
          {choice:myChoice,team:myTeam,name:myName});
      };
    });

    listen(roomRef(`answers/${info.qid}`),snap=>{
      const data=snap.exists()?snap.val():{};
      const tot=Object.values(data).filter(v=>v.choice!=null).length;
      const el=document.getElementById('answerCount');
      if(el) el.textContent=`${tot}명 답변 완료`;
    });

  } else if(info.phase==='revealed'){
    get(dbRef(`rooms/${roomCode}/answers/${info.qid}/${pid}`)).then(snap=>{
      const myAns=snap.exists()?snap.val().choice:null;
      const tot=info.counts?Object.values(info.counts).reduce((a,b)=>a+b,0)||1:1;

      // 정답 공개 배너
      showAnswerAnnounce(info.correct+1,(info.options||[])[info.correct]||'');

      // 맞춤/틀림 효과
      setTimeout(()=>{
        if(myAns===info.correct){ playCorrectSound(); showJesus(); }
        else { showWrong(); }
      },600);

      const optArea=document.getElementById('revealOpts');
      if(optArea) optArea.innerHTML=info.options.map((o,i)=>{
        const c=(info.counts||{})[i]||0, pct=Math.round(c/tot*100);
        const cls=i===info.correct?'correct':(myAns===i?'wrong':'dim');
        return `<div class="opt-btn ${cls}" style="cursor:default">
          <div class="opt-bar" style="width:${pct}%"></div>
          <div class="opt-num">${i+1}</div>
          <span>${esc(o)}${i===info.correct?' ✓':''}</span>
          <span class="opt-count">${c}명 (${pct}%)</span>
        </div>`;
      }).join('');
      const badge=document.getElementById('myResultBadge');
      if(badge){
        if(myAns===null) badge.innerHTML=`<span class="result-badge none">미응답 (오답 처리)</span>`;
        else if(myAns===info.correct) badge.innerHTML=`<span class="result-badge correct">🙌 정답입니다!</span>`;
        else badge.innerHTML=`<span class="result-badge wrong">아쉽지만 오답입니다</span>`;
      }
    });
  }
}

function startPlayerTimer(remaining,total,qid){
  const arc=document.getElementById('timerArc');
  const numEl=document.getElementById('timerNum');
  const circumference=2*Math.PI*34;
  function update(rem){
    if(!arc||!numEl) return;
    arc.style.strokeDashoffset=circumference*(1-Math.max(rem,0)/total);
    numEl.textContent=Math.max(rem,0);
    if(rem<=5){arc.style.stroke='var(--red)';numEl.style.color='var(--red)';}
    else if(rem<=10){arc.style.stroke='var(--gold)';numEl.style.color='var(--gold)';}
    else{arc.style.stroke='var(--green)';numEl.style.color='var(--text)';}
  }
  update(remaining);
  function startFlash(){
    stopFlash();
    flashInterval=setInterval(()=>{
      flash.classList.add('flash');
      setTimeout(()=>flash.classList.remove('flash'),200);
    },600);
  }
  if(remaining<=5) startFlash();
  timerInterval=setInterval(()=>{
    remaining--;
    update(remaining);
    if(remaining===5) startFlash();
    if(remaining<=0){
      stopTimer(); stopFlash();
      const label=document.getElementById('timerLabel');
      if(label) label.textContent='시간 종료!';
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      if(myChoice===null){
        set(dbRef(`rooms/${roomCode}/answers/${qid}/${pid}`),{choice:null,team:myTeam,name:myName});
      }
    }
  },1000);
}

function parseQueue(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const sep=l.includes('|')?'|':',';
    const p=l.split(sep).map(s=>s.trim()).filter(Boolean);
    if(p.length<4) return null;
    const correct=parseInt(p[p.length-1],10);
    const opts=p.slice(1,p.length-1);
    if(!(correct>=1&&correct<=opts.length)) return null;
    return {q:p[0],opts,correct:correct-1};
  }).filter(Boolean);
}

renderLanding();
