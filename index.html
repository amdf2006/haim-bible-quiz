<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>하임 성경 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1B2A;
  --bg2: #162236;
  --bg3: #1E2E42;
  --border: #2A3F58;
  --gold: #F0C040;
  --gold2: #C9962A;
  --text: #EEE8D5;
  --muted: #7A91A8;
  --green: #5DBB8A;
  --red: #E05C5C;
  --blue: #4A9FD4;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  padding: 16px 16px 60px;
}
.wrap { max-width: 860px; margin: 0 auto; }
.serif { font-family: 'Noto Serif KR', serif; }

/* Typography */
h1 { font-family: 'Noto Serif KR', serif; font-size: clamp(28px, 5vw, 48px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
h2 { font-family: 'Noto Serif KR', serif; font-size: clamp(18px, 3vw, 24px); font-weight: 700; }

/* Layout helpers */
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }
.center { text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 120px; }
.hidden { display: none !important; }

/* Card */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
}

/* Inputs */
input, textarea, select {
  font-family: inherit; font-size: 15px;
  color: var(--text); background: var(--bg3);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 14px; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.05em; }
select option { background: var(--bg3); }

/* Buttons */
button {
  font-family: inherit; font-size: 15px; font-weight: 700;
  border: none; border-radius: 9px; cursor: pointer;
  padding: 12px 18px; transition: filter 0.1s, transform 0.08s;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-gold { background: var(--gold); color: var(--bg); }
.btn-gold:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.btn-green { background: var(--green); color: var(--bg); }
.btn-green:hover:not(:disabled) { filter: brightness(1.08); }
.btn-red { background: var(--red); color: #fff; }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-size: 13px; padding: 8px 14px; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

/* Error */
.err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }

/* Room code */
.roomcode {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(48px, 10vw, 80px);
  font-weight: 900;
  letter-spacing: 0.3em; text-indent: 0.3em;
  color: var(--gold);
  text-shadow: 0 0 40px rgba(240,192,64,0.3);
}

/* Mode pills */
.mode-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.mode-btn {
  background: var(--bg3); border: 2px solid var(--border);
  border-radius: 10px; padding: 14px 8px;
  color: var(--text); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  text-align: center; line-height: 1.4;
}
.mode-btn:hover { border-color: var(--gold); }
.mode-btn.active { border-color: var(--gold); background: rgba(240,192,64,0.12); color: var(--gold); }
.mode-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }

/* Team picker */
.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
.team-btn {
  background: var(--bg3); border: 2px solid var(--border);
  border-radius: 10px; padding: 18px 8px;
  color: var(--text); font-size: 16px; font-weight: 700;
  cursor: pointer; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.team-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Question box */
.qbox {
  border-left: 4px solid var(--gold);
  padding: 16px 18px; background: var(--bg3);
  border-radius: 0 var(--r) var(--r) 0;
}
.qnum { font-size: 12px; color: var(--gold); letter-spacing: 0.15em; margin-bottom: 8px; }
.qtext { font-family: 'Noto Serif KR', serif; font-size: clamp(18px,3vw,26px); line-height: 1.55; }

/* Timer */
.timer-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
.timer-circle-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
.timer-svg { transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: var(--bg3); stroke-width: 6; }
.timer-arc { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear, stroke 0.5s; }
.timer-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 900;
}
.timer-label { font-size: 14px; color: var(--muted); }

/* Flash overlay */
#flashOverlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: rgba(220,50,50,0); transition: background 0.15s;
}
#flashOverlay.flash { background: rgba(220,50,50,0.22); }

/* Answer options */
.opt-grid { display: grid; gap: 10px; margin-top: 14px; }
.opt-btn {
  position: relative; overflow: hidden;
  width: 100%; text-align: left;
  background: var(--bg3); color: var(--text);
  border: 2px solid var(--border); border-radius: 11px;
  padding: 15px 18px; font-size: 16px; font-weight: 500;
  cursor: pointer; transition: border-color 0.15s;
  display: flex; align-items: center; gap: 12px;
}
.opt-btn:hover:not(:disabled) { border-color: var(--gold); }
.opt-btn.selected { border-color: var(--gold); background: rgba(240,192,64,0.1); }
.opt-btn.correct { border-color: var(--green); background: rgba(93,187,138,0.12); }
.opt-btn.wrong { border-color: var(--red); background: rgba(224,92,92,0.1); opacity: 0.7; }
.opt-btn.dim { opacity: 0.5; }
.opt-num {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.opt-btn.selected .opt-num { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.opt-btn.correct .opt-num { background: var(--green); color: var(--bg); border-color: var(--green); }
.opt-bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
  background: rgba(240,192,64,0.08); transition: width 0.5s ease; pointer-events: none;
}
.opt-btn.correct .opt-bar { background: rgba(93,187,138,0.08); }
.opt-count { margin-left: auto; font-size: 13px; color: var(--gold); font-weight: 700; flex-shrink: 0; }

/* Scoreboard */
.score-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 10px; }
.score-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 11px; padding: 14px; text-align: center;
}
.score-card.leader { border-color: var(--gold); }
.score-card .sc-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.score-card .sc-val { font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 900; color: var(--gold); }
.score-card .sc-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.score-card .sc-delta { font-size: 12px; color: var(--green); min-height: 16px; }

/* Individual ranking */
.rank-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.rank-item {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 9px; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.rank-item.me { border-color: var(--gold); }
.rank-num { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 900; color: var(--muted); width: 28px; flex-shrink: 0; }
.rank-num.top { color: var(--gold); }
.rank-name { flex: 1; font-weight: 700; }
.rank-team { font-size: 12px; color: var(--muted); }
.rank-score { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 900; color: var(--gold); }

/* Live dot */
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
@media (prefers-reduced-motion:reduce) { .live-dot { animation:none; } }

/* Status pill */
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--muted); }
.pill b { color: var(--gold); }

/* Host answer buttons */
.reveal-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(100px,1fr)); gap: 8px; margin-top: 10px; }
.reveal-btn { background: var(--bg3); border: 2px solid var(--border); border-radius: 9px; padding: 12px 8px; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }
.reveal-btn:hover { border-color: var(--green); color: var(--green); }

/* Queue */
.queue-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.queue-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.queue-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* Notice */
.notice { font-size: 13px; color: var(--muted); line-height: 1.7; }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* Waiting animation */
.waiting-dots span { animation: blink 1.4s infinite; }
.waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
.waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

/* Result badge */
.result-badge { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 15px; margin-top: 12px; }
.result-badge.correct { background: rgba(93,187,138,0.2); color: var(--green); border: 1px solid var(--green); }
.result-badge.wrong { background: rgba(224,92,92,0.15); color: var(--red); border: 1px solid var(--red); }
.result-badge.none { background: rgba(122,145,168,0.15); color: var(--muted); border: 1px solid var(--muted); }

details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
details summary:hover { color: var(--gold); }
</style>
</head>
<body>
<div id="flashOverlay"></div>
<div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, off, push, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ── Firebase init ── */
const firebaseConfig = {
  apiKey: "AIzaSyCZq1EuGmgHeUln6UyM_L25sJdqCvfzvMU",
  authDomain: "haim-bible-quiz.firebaseapp.com",
  databaseURL: "https://haim-bible-quiz-default-rtdb.firebaseio.com",
  projectId: "haim-bible-quiz",
  storageBucket: "haim-bible-quiz.firebasestorage.app",
  messagingSenderId: "917253634065",
  appId: "1:917253634065:web:97f3b05042da918be6d9b0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

/* ── Helpers ── */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Array.from({length:n},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join('');
const app = document.getElementById('app');
const flash = document.getElementById('flashOverlay');

/* ── State ── */
let role=null, roomCode=null, pid=rand(10), myName='', myTeam=null;
let listeners=[], hostQueue=[], editIdx=null;
let timerInterval=null, flashInterval=null;
let lastPhase=null, lastQid=null;

function dbRef(path){ return ref(db, path); }
function roomRef(p){ return ref(db, `rooms/${roomCode}/${p}`); }

function clearListeners(){
  listeners.forEach(({r,fn})=>off(r,'value',fn));
  listeners=[];
}
function listen(r, fn){
  onValue(r, fn);
  listeners.push({r,fn});
}
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function stopFlash(){ if(flashInterval){clearInterval(flashInterval);flashInterval=null;} flash.className=''; }

/* ══════════════════════════════════
   LANDING
══════════════════════════════════ */
function renderLanding(msg=''){
  clearListeners(); stopTimer(); stopFlash();
  app.innerHTML=`
  <div class="center mt32">
    <h1>하임 성경 퀴즈</h1>
    <p class="serif mt8" style="color:var(--muted);font-size:15px">"주의 말씀은 내 발의 등이요 내 길의 빛이니이다" — 시편 119:105</p>
  </div>
  <div class="card mt32">
    <label>방 코드로 입장하기</label>
    <div class="row">
      <input id="joinCode" maxlength="12" placeholder="방 코드 입력" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px;text-align:center">
      <button class="btn-gold" id="btnJoin" style="flex:none;padding:12px 24px">입장</button>
    </div>
    <div class="err" id="joinErr">${esc(msg)}</div>
    <hr class="divider">
    <button class="btn-ghost" id="btnHost" style="width:100%;padding:14px">진행자로 방 만들기</button>
  </div>
  <p class="notice center mt16">로그인 없이 링크와 방 코드만으로 참여할 수 있습니다.</p>`;

  document.getElementById('btnHost').onclick = renderHostSetup;
  const doJoin = async ()=>{
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    if(!code){ document.getElementById('joinErr').textContent='방 코드를 입력해 주세요.'; return; }
    const snap = await get(dbRef(`rooms/${code}/info`));
    if(!snap.exists()){ document.getElementById('joinErr').textContent='해당 코드의 방을 찾을 수 없습니다.'; return; }
    roomCode=code; role='player';
    renderNameAndTeam(snap.val());
  };
  document.getElementById('btnJoin').onclick = doJoin;
  document.getElementById('joinCode').addEventListener('keydown',e=>{ if(e.key==='Enter') doJoin(); });
}

/* ══════════════════════════════════
   HOST SETUP
══════════════════════════════════ */
function renderHostSetup(){
  app.innerHTML=`
  <div class="center mt24"><h1>새 퀴즈 방 만들기</h1></div>
  <div class="card mt24">
    <label>방 코드 (영문/숫자 3~10자, 비우면 자동생성)</label>
    <input id="customCode" maxlength="10" placeholder="예: HAIM2024" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:20px">

    <div class="mt16">
      <label>퀴즈 모드</label>
      <div class="mode-grid">
        <div class="mode-btn active" data-mode="individual"><span class="icon">🏅</span>개인전</div>
        <div class="mode-btn" data-mode="team"><span class="icon">🏆</span>팀전</div>
        <div class="mode-btn" data-mode="both"><span class="icon">⚡</span>개인+팀</div>
      </div>
    </div>

    <div id="teamSection" class="mt16 hidden">
      <label>팀 이름 (쉼표로 구분)</label>
      <input id="teamNames" value="신도림팀, 구로팀, 양평팀">
    </div>

    <div class="mt16">
      <label>기본 제한시간</label>
      <select id="defTimer">
        <option value="10">10초</option>
        <option value="15">15초</option>
        <option value="20" selected>20초</option>
        <option value="30">30초</option>
      </select>
    </div>

    <div class="err" id="hostErr"></div>
    <div class="row mt16">
      <button class="btn-ghost" id="backBtn">뒤로</button>
      <button class="btn-gold" id="makeBtn">방 만들기</button>
    </div>
  </div>`;

  document.getElementById('backBtn').onclick = ()=>renderLanding();

  let selectedMode='individual';
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); selectedMode=b.dataset.mode;
      const ts=document.getElementById('teamSection');
      if(selectedMode==='individual') ts.classList.add('hidden'); else ts.classList.remove('hidden');
    };
  });

  let overwriteArmed=false;
  document.getElementById('makeBtn').onclick = async ()=>{
    const err=document.getElementById('hostErr');
    err.textContent='';
    let code=document.getElementById('customCode').value.trim().toUpperCase();
    if(code && !/^[A-Z0-9]{3,10}$/.test(code)){ err.textContent='코드는 영문/숫자 3~10자로 입력해 주세요.'; return; }
    if(!code) code=rand(5);

    let teams=[];
    if(selectedMode!=='individual'){
      teams=document.getElementById('teamNames').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(teams.length<2){ err.textContent='팀을 2개 이상 입력해 주세요.'; return; }
    }

    // check existing
    const snap=await get(dbRef(`rooms/${code}/info`));
    if(snap.exists()){
      if(!overwriteArmed){
        overwriteArmed=true;
        err.textContent='이미 사용 중인 코드입니다. 한 번 더 누르면 기존 방을 초기화합니다.';
        err.style.color='var(--gold)'; return;
      }
      await remove(dbRef(`rooms/${code}`));
    }

    roomCode=code;
    const defTimer=parseInt(document.getElementById('defTimer').value);
    const info={ phase:'lobby', mode:selectedMode, teams, defTimer,
      scores: selectedMode!=='individual' ? Object.fromEntries(teams.map(t=>[t,0])) : {},
      qid:0, question:'', options:[], correct:null, timerSec:defTimer, startedAt:null };
    await set(dbRef(`rooms/${code}/info`), info);
    role='host'; hostQueue=[];
    renderHost();
  };
}

/* ══════════════════════════════════
   HOST MAIN
══════════════════════════════════ */
function renderHost(){
  clearListeners(); stopTimer(); stopFlash();
  app.innerHTML=`<div id="hostRoot"></div>`;
  listen(roomRef('info'), snap=>{
    if(!snap.exists()) return;
    renderHostUI(snap.val());
  });
}

function renderHostUI(info){
  const root=document.getElementById('hostRoot');
  if(!root) return;

  const isTeam = info.mode!=='individual';
  const isBoth = info.mode==='both';

  // scoreboard HTML
  let sbHTML='';
  if(isTeam && info.teams && info.teams.length){
    const scores=info.scores||{};
    const vals=info.teams.map(t=>scores[t]||0);
    const max=Math.max(...vals,0);
    sbHTML=`<div class="score-grid mt12">${info.teams.map(t=>`
      <div class="score-card ${(scores[t]||0)===max&&max>0?'leader':''}">
        <div class="sc-name">${esc(t)}</div>
        <div class="sc-val">${Math.round((scores[t]||0)*10)/10}</div>
        <div class="sc-sub">정답률 %</div>
      </div>`).join('')}</div>`;
  }

  let phaseHTML='';

  if(info.phase==='lobby' || info.phase==='revealed'){
    // question form
    const preQ = hostQueue.length ? hostQueue[0].q : '';
    const preO = hostQueue.length ? hostQueue[0].opts.join('\n') : '';
    const preC = hostQueue.length ? hostQueue[0].correct+1 : '';
    phaseHTML=`
    <div class="card mt16">
      <h2>문제 출제</h2>
      <div class="mt12"><label>문제</label>
        <textarea id="qText" rows="2" placeholder="예: 예수님이 태어나신 곳은?">${esc(preQ)}</textarea></div>
      <div class="mt12"><label>보기 (한 줄에 하나, 2~4개)</label>
        <textarea id="qOpts" rows="4" placeholder="베들레헴&#10;나사렛&#10;예루살렘&#10;가나">${esc(preO)}</textarea></div>
      <div class="mt12 row" style="align-items:flex-end">
        <div>
          <label>제한시간</label>
          <select id="qTimer">
            <option value="10" ${info.defTimer===10?'selected':''}>10초</option>
            <option value="15" ${info.defTimer===15?'selected':''}>15초</option>
            <option value="20" ${info.defTimer===20||!info.defTimer?'selected':''}>20초</option>
            <option value="30" ${info.defTimer===30?'selected':''}>30초</option>
          </select>
        </div>
        <button class="btn-gold" id="fireBtn" style="flex:none">문제 전송 →</button>
      </div>
      <div class="err" id="qErr"></div>

    </div>`;
  } else if(info.phase==='question'){
    phaseHTML=`
    <div class="card mt16">

        <p style="font-size:13px;color:var(--muted);margin-bottom:8px">정답을 선택해 점수를 반영하세요:</p>
        <div class="reveal-grid">${info.options.map((o,i)=>`
          <button class="reveal-btn" data-c="${i}">정답: ${i+1}번</button>`).join('')}</div>
      </div>
    </div>`;
  }

  // revealed
  let revHTML='';
  if(info.phase==='revealed' && info.counts){
    const tot=Object.values(info.counts).reduce((a,b)=>a+b,0)||1;
    revHTML=`
    <div class="card mt16">
      <div class="qbox"><div class="qnum">문제 ${info.qid} · 결과</div>
        <div class="qtext mt8">${esc(info.question)}</div></div>
      <div class="opt-grid mt12">${info.options.map((o,i)=>{
        const c=info.counts[i]||0;
        const pct=Math.round(c/tot*100);
        return `<div class="opt-btn ${i===info.correct?'correct':'dim'}" style="cursor:default">
          <div class="opt-bar" style="width:${pct}%"></div>
          <div class="opt-num">${i+1}</div>
          <span>${esc(o)}${i===info.correct?' ✓':''}</span>
          <span class="opt-count">${c}명 (${pct}%)</span>

  let rankHTML='';

  root.innerHTML=`
  <div class="center mt8">

    <div class="roomcode">${roomCode}</div>

  // member count
  listen(roomRef('members'), snap=>{
    const el=document.getElementById('memCount');

  const saveTeamBtn=document.getElementById('saveTeamBtn');

    const scores=Object.fromEntries(teams.map(t=>[t, (info.scores||{})[t]||0]));
    await update(roomRef('info'), {teams, scores});
  };

  // live answers (host)
  if(info.phase==='question'){
    listen(roomRef(`answers/${info.qid}`), snap=>{
      const data=snap.exists()?snap.val():{};
      const counts={};
      info.options.forEach((_,i)=>counts[i]=0);
      Object.values(data).forEach(v=>{ if(v.choice!=null) counts[v.choice]=(counts[v.choice]||0)+1; });
      const tot=Object.values(counts).reduce((a,b)=>a+b,0);
      const el=document.getElementById('totCount');
      if(el) el.textContent=tot;
      const area=document.getElementById('optLive');
      if(area) area.innerHTML=info.options.map((o,i)=>{
        const c=counts[i]||0;
        const pct=tot?Math.round(c/tot*100):0;
        return `<div class="opt-btn" style="cursor:default">
          <div class="opt-bar" style="width:${pct}%"></div>
          <div class="opt-num">${i+1}</div><span>${esc(o)}</span>
          <span class="opt-count">${c}명</span></div>`;
      }).join('');
    });
    // reveal buttons
    document.querySelectorAll('.reveal-btn').forEach(b=>{
      b.onclick=()=>revealAnswer(info, +b.dataset.c);
    });
  }

  // fire question
  const fireBtn=document.getElementById('fireBtn');
  if(fireBtn){
    renderQueue();
    document.getElementById('addBulkBtn').onclick=()=>{
      const items=parseQueue(document.getElementById('bulkTA').value);
      if(!items.length){ document.getElementById('qErr').textContent='형식 오류: 문제, 보기1, 보기2, ..., 정답번호'; return; }

      const opts=document.getElementById('qOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const timerSec=parseInt(document.getElementById('qTimer').value);
      const err=document.getElementById('qErr');

      if(hostQueue.length && hostQueue[0].q===q) hostQueue.shift();
      fireBtn.disabled=true;
      const newQid=(info.qid||0)+1;
      await update(roomRef('info'),{
        phase:'question', qid:newQid, question:q, options:opts,
        correct:null, counts:null, timerSec, startedAt:Date.now()
      });

      setTimeout(async()=>{
        const snap=await get(roomRef('info'));
        if(snap.exists()&&snap.val().phase==='question'&&snap.val().qid===newQid){

        }
      }, timerSec*1000+500);
      fireBtn.disabled=false;
    };
  }

  const endBtn=document.getElementById('endBtn');

    if(!endArmed){

      return;
    }

    await remove(dbRef(`rooms/${roomCode}`));
    roomCode=null; role=null;
    renderLanding('퀴즈가 종료되었습니다.');
  };
}

function renderQueue(){
  const box=document.getElementById('queueBox'); if(!box) return;
  if(!hostQueue.length){ box.innerHTML=''; return; }
  box.innerHTML=`<p style="font-size:13px;color:var(--muted);margin-top:14px">대기 중인 문제 ${hostQueue.length}개</p>`+
    hostQueue.map((it,i)=>`
    <div class="queue-item">
      <span>${i+1}. ${esc(it.q)}</span>
      <div class="queue-actions">
        <button class="btn-ghost btn-sm qedit" data-i="${i}">수정</button>
        <button class="btn-ghost btn-sm qdel" data-i="${i}">삭제</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('.qdel').forEach(b=>b.onclick=()=>{ hostQueue.splice(+b.dataset.i,1); renderQueue(); });
  box.querySelectorAll('.qedit').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.i, it=hostQueue[idx];
    const bd=document.getElementById('bulkBox'); if(bd) bd.open=true;
    document.getElementById('bulkTA').value=`${it.q}, ${it.opts.join(', ')}, ${it.correct+1}`;
    editIdx=idx; document.getElementById('addBulkBtn').textContent='수정 완료';
    document.getElementById('bulkTA').focus();
    // pre-fill main form
    document.getElementById('qText').value=it.q;
    document.getElementById('qOpts').value=it.opts.join('\n');
  });
}

async function revealAnswer(info, correct){
  document.querySelectorAll('.reveal-btn').forEach(b=>b.disabled=true);
  const snap=await get(roomRef(`answers/${info.qid}`));
  const data=snap.exists()?snap.val():{};
  const counts={};
  info.options.forEach((_,i)=>counts[i]=0);
  Object.values(data).forEach(v=>{ if(v.choice!=null) counts[v.choice]=(counts[v.choice]||0)+1; });

  // update individual scores
  const memberSnap=await get(roomRef('members'));
  const members=memberSnap.exists()?memberSnap.val():{};
  const updates={};

  // team correct counts
  const teamCorrect={};
  const teamTotal={};

  Object.entries(data).forEach(([pid,v])=>{
    if(v.choice===correct){
      updates[`members/${pid}/score`]=(members[pid]?.score||0)+1;
    }
    if(v.team!=null){
      teamTotal[v.team]=(teamTotal[v.team]||0)+1;
      if(v.choice===correct) teamCorrect[v.team]=(teamCorrect[v.team]||0)+1;
    }
  });

  // update team scores (cumulative average %)
  if(info.teams && info.teams.length){
    const prevScores=info.scores||{};
    const prevQid=(info.qid||1)-1;
    info.teams.forEach(t=>{
      const tot=teamTotal[t]||0;
      const cor=teamCorrect[t]||0;
      const pct=tot>0?(cor/tot*100):0;
      // running average
      const prev=prevScores[t]||0;
      const newScore=prevQid>0?(prev*prevQid+pct)/(prevQid+1):pct;
      updates[`info/scores/${t}`]=Math.round(newScore*10)/10;
    });
  }

  updates['info/phase']='revealed';
  updates['info/correct']=correct;
  updates[`info/counts`]=counts;
  await update(roomRef(''), updates);
}

function renderPlayer(){
  clearListeners(); stopTimer(); stopFlash();
  app.innerHTML=`<div id="playerRoot"></div>`;
  listen(roomRef('info'), snap=>{
    if(!snap.exists()){ renderLanding('진행자가 퀴즈를 종료했습니다.'); return; }
    const info=snap.val();
    if(info.phase!==lastPhase || info.qid!==lastQid){
      lastPhase=info.phase; lastQid=info.qid;
      stopTimer(); stopFlash();
      renderPlayerUI(info);
    }
  });
}

function startPlayerTimer(remaining, total, qid){
  const arc=document.getElementById('timerArc');
  const numEl=document.getElementById('timerNum');
  const circumference=2*Math.PI*34;

  function update(rem){
    if(!arc||!numEl) return;
    const pct=rem/total;
    arc.style.strokeDashoffset=circumference*(1-pct);
    numEl.textContent=rem;
    if(rem<=5){
      arc.style.stroke='var(--red)';
      numEl.style.color='var(--red)';
    } else if(rem<=10){
      arc.style.stroke='var(--gold)';
      numEl.style.color='var(--gold)';
    } else {
      arc.style.stroke='var(--green)';
      numEl.style.color='var(--text)';
    }
  }
  update(remaining);

  // flash at 5s
  function startFlash(){
    stopFlash();
    flashInterval=setInterval(()=>{
      flash.classList.add('flash');
      setTimeout(()=>flash.classList.remove('flash'),200);
    },600);
  }
  if(remaining<=5) startFlash();

  timerInterval=setInterval(()=>{
    remaining--;
    update(remaining);
    if(remaining===5) startFlash();
    if(remaining<=0){
      stopTimer(); stopFlash();
      const label=document.getElementById('timerLabel');
      if(label) label.textContent='시간 종료!';
      if(numEl) numEl.style.color='var(--red)';
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      // record non-answer
      if(myChoice===null){
        set(dbRef(`rooms/${roomCode}/answers/${qid}/${pid}`),
          { choice:null, team:myTeam, name:myName });
      }
    }
  },1000);
}

function parseQueue(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const sep=l.includes('|')?'|':',';
    const p=l.split(sep).map(s=>s.trim()).filter(Boolean);
    if(p.length<4) return null;
    const correct=parseInt(p[p.length-1],10);
    const opts=p.slice(1,p.length-1);
    if(!(correct>=1&&correct<=opts.length)) return null;
    return {q:p[0], opts, correct:correct-1};
  }).filter(Boolean);
}
